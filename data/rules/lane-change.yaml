# Lane change between two lanes of the same direction. Tier 1: no indicator toward the new lane
# held for signalLeadS before the crossing, a line not crossable from this side, or a second
# lane line crossed within skipWindowS. Tier 2 (the unsafe-gap wording ND 238 added to the same
# clause): a vehicle the ego moves in front of or behind too closely. A car counts when its centre
# is in the target lane, a motorbike only when it overlaps the strip the ego moves into. A vehicle
# below stoppedSpeedMps is too close within gapAheadM ahead or gapBehindM behind; a moving one
# when the follower's time gap after the change would be under gapTimeS (ego speed for a vehicle
# ahead, the vehicle's speed for one behind). gapTimeS 0.5 s is a design value: at the stopped gap of 5 m it
# matches a 36 km/h move, and it keeps a cut-in into dense motorbike traffic possible.
id: lane-change
title: { vi: "Chuyển làn không đúng quy định" }
description: { vi: "Chuyển làn không xi nhan trước, qua vạch liền, chuyển hai làn một lúc hoặc không bảo đảm khoảng cách an toàn." }
vehicleClasses: [car, motorbike]
detection:
  type: lane-line-cross
  params: { signalLeadS: 1, skipWindowS: 3, gapAheadM: 5, gapBehindM: 10, gapTimeS: 0.5, stoppedSpeedMps: 0.5 }
  paramBasis: { signalLeadS: design, skipWindowS: design, gapAheadM: design, gapBehindM: design, gapTimeS: design, stoppedSpeedMps: design }
obligation:
  - sourceId: law36-2024
    article: Điều 13
    clause: '2'
    quote: chỉ được chuyển làn đường ở những nơi cho phép; mỗi lần chuyển làn đường chỉ được phép chuyển sang một làn đường liền kề; khi chuyển làn đường phải có tín hiệu báo trước; phải quan sát bảo đảm khoảng cách an toàn với xe phía trước, phía sau và hai bên mới được chuyển làn.
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/55-vbhn-vpqh.pdf
tiers:
  - when: { fault: true }
    danger: 2
    scoreOnly: false
    clause: { D6: D6.2.a, D7: D7.1.e }
  - when: { unsafeGap: true }
    danger: 3
    scoreOnly: false
    clause: { D6: D6.2.a, D7: D7.1.e }
    note: { vi: "Chuyển làn khi có xe ở làn bên cạnh quá gần." }
