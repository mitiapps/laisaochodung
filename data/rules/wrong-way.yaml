# Wrong way: travelling against a one-way road, or crossing a P.102 "Cấm đi ngược chiều" entry in
# its banned direction. It wins over no-entry and wrong-side for the same act.
id: wrong-way
title: { vi: "Đi ngược chiều" }
description: { vi: "Đi ngược chiều của đường một chiều hoặc đi vào đường có biển cấm đi ngược chiều." }
vehicleClasses: [car, motorbike]
detection:
  type: against-lane-dir
  params: { mode: oneway, againstAngleDeg: 120, minSpeedMps: 0.5 }
  paramBasis: { mode: legal, againstAngleDeg: design, minSpeedMps: design }
obligation:
  - sourceId: law36-2024
    article: Điều 10
    clause: '1'
    quote: phải đi bên phải theo chiều đi của mình, đi đúng làn đường, phần đường quy định, chấp hành báo hiệu đường bộ
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/55-vbhn-vpqh.pdf
  - sourceId: qcvn41-2024
    article: Phụ lục B
    point: B.2 a)
    quote: Để báo đường cấm các loại xe (cơ giới và thô sơ) đi vào theo chiều đặt biển
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/51-bgtvt-kem.pdf
supersedes:
  - { ruleId: no-entry }
  - { ruleId: wrong-side }
tiers:
  - danger: 4
    scoreOnly: false
    clause: { D6: D6.9.d, D7: D7.7.a }
