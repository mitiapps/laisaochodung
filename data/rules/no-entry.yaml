# Crossing a no-entry line (P.101, P.102 or a class ban) in its banned heading with a banned
# vehicle class. Wrong-way wins over this rule for a P.102 entry.
id: no-entry
title: { vi: "Đi vào đường cấm" }
description: { vi: "Đi vào đường hoặc khu vực có biển cấm đi vào đối với loại xe đang điều khiển." }
vehicleClasses: [car, motorbike]
detection:
  type: entry-cross
  params: { headingToleranceDeg: 90 }
  paramBasis: { headingToleranceDeg: design }
obligation:
  - sourceId: law36-2024
    article: Điều 11
    clause: '5'
    point: a
    quote: Biển báo cấm để biểu thị các điều cấm
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/55-vbhn-vpqh.pdf
  - sourceId: qcvn41-2024
    article: Phụ lục B
    point: B.1 a)
    quote: Để báo đường cấm các loại phương tiện đi lại cả hai hướng, trừ các xe được ưu tiên theo quy định
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/51-bgtvt-kem.pdf
tiers:
  - danger: 3
    scoreOnly: false
    clause: { D6: D6.5.i, D7: D7.6.b }
