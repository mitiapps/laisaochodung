# A turn or U-turn that a restriction (P.123a, P.124a) bans from the approach lane. For a
# motorbike a banned left or right turn and a turn without the indicator are the same clause
# (7.3.a), so this rule wins over turn-signal there.
id: banned-turn
title: { vi: "Rẽ hoặc quay đầu nơi có biển cấm" }
description: { vi: "Rẽ trái, rẽ phải hoặc quay đầu tại nút giao có biển cấm hướng đó từ làn đang đi." }
vehicleClasses: [car, motorbike]
detection:
  type: junction-turn
  params: { mode: restriction, turnMinDeg: 45, uturnMinDeg: 135 }
  paramBasis: { mode: legal, turnMinDeg: design, uturnMinDeg: design }
obligation:
  - sourceId: law36-2024
    article: Điều 11
    clause: '5'
    point: a
    quote: Biển báo cấm để biểu thị các điều cấm
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/55-vbhn-vpqh.pdf
  - sourceId: qcvn41-2024
    article: Phụ lục B
    point: B.24 a)
    quote: Để báo cấm các loại xe quay đầu (theo kiểu chữ U), đặt biển số P.124a
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/51-bgtvt-kem.pdf
supersedes:
  - { ruleId: turn-signal, decreeGroups: [D7] }
tiers:
  - when: { manoeuvre: [left, right] }
    danger: 3
    scoreOnly: false
    clause: { D6: D6.4.k, D7: D7.3.a }
  - when: { manoeuvre: uturn }
    danger: 3
    scoreOnly: false
    clause: { D6: D6.4.k, D7: D7.2.k }
