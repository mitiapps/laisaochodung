# Tailgating: a time gap under minTimeGapS to the car ahead in the same lane for sustainS, only
# above minSpeedMps so a queue does not count. ND 168 (6.4.l / 7.3.i) fines a short gap only when
# it leads to a va chạm with the vehicle ahead (handled by the crash rule) or breaks the distance
# of a "Cự ly tối thiểu giữa hai xe" sign. No shipped map places that sign, so this deducts score
# only; a map that adds it needs a legal tier here.
id: following-distance
title: { vi: "Không giữ khoảng cách an toàn" }
description: { vi: "Bám quá sát xe phía trước cùng làn." }
vehicleClasses: [car, motorbike]
detection:
  type: gap-ahead
  params: { minSpeedMps: 5, minTimeGapS: 1, sustainS: 2 }
  paramBasis: { minSpeedMps: design, minTimeGapS: design, sustainS: design }
obligation:
  - sourceId: law36-2024
    article: Điều 12
    clause: '1'
    quote: phải chấp hành quy định về tốc độ, khoảng cách an toàn tối thiểu với xe phía trước cùng làn đường hoặc phần đường.
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/3/55-vbhn-vpqh.pdf
tiers:
  - danger: 2
    scoreOnly: true
    note: { vi: "Luật chỉ phạt khi không giữ khoảng cách mà gây va chạm với xe phía trước, hoặc khi vi phạm biển “Cự ly tối thiểu giữa hai xe”; đoạn đường này không có biển đó nên lỗi chỉ trừ điểm trò chơi." }
