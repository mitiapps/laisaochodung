# Horn from 22:00 to 05:00 inside a built-up zone.
id: night-horn
title: { vi: "Bấm còi ban đêm trong khu dân cư" }
description: { vi: "Sử dụng còi từ 22 giờ đến 5 giờ sáng trong khu đông dân cư." }
vehicleClasses: [car, motorbike]
detection:
  type: horn-in-window
  params: { fromMin: 1320, toMin: 300 }
  paramBasis: { fromMin: legal, toMin: legal }
obligation:
