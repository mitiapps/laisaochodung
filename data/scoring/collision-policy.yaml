# Collision clause choice (CollisionPolicy, src/contracts/rule.js).
#
# An accident (a pedestrian hit, or an NPC car hit at a closing speed of at least `accidentRelSpeed`) cites
# `accidentB` when the clause of its cause is in `accidentBList`, else `accidentA`; with no cause
# it cites `accidentA` ("không quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn theo quy
# định mà gây tai nạn giao thông").
#
# `accidentBList` copies the điểm lists named in ND 168 Điều 6 khoản 10 điểm b and Điều 7
# khoản 10 điểm b (clause records D6.10.b, D7.10.b); scripts/rules/build.test.js parses those
# quotes and checks the lists match.
#
# `inferredAccidentCauses` lists causes named in neither 10.a nor 10.b. An entry is a clause id
# or a rule id; the accident then cites `accidentA` with "suy luận". Pavement driving is named in
# neither list. It is listed by rule id because its motorbike clause D7.7.a also covers wrong-way
# riding, which 7.10.a names, so the clause id alone cannot tell the two apart.

accidentA: { D6: D6.10.a, D7: D7.10.a }
accidentB: { D6: D6.10.b, D7: D7.10.b }
accidentBList:
  D6: [D6.1.a, D6.1.b, D6.1.c, D6.1.d, D6.1.đ, D6.2.c, D6.3.b, D6.3.g, D6.3.h, D6.3.n, D6.3.o, D6.3.p,
       D6.4.a, D6.4.c, D6.4.d, D6.5.c, D6.5.d, D6.5.e, D6.5.h, D6.5.n, D6.5.o, D6.5.q, D6.7.b, D6.9.b,
       D6.9.c, D6.9.d]
  D7: [D7.1.a, D7.1.d, D7.1.đ, D7.1.g, D7.1.h, D7.1.i, D7.1.k, D7.2.c, D7.2.đ, D7.2.g, D7.3.b, D7.3.e,
       D7.3.g, D7.3.h, D7.3.k, D7.4.đ, D7.6.c, D7.6.d, D7.7.c, D7.7.d, D7.7.đ, D7.9.a, D7.9.b, D7.9.h,
       D7.9.k]
inferredAccidentCauses: [pavement]
# Va chạm with the vehicle ahead in the same lane below `accidentRelSpeed`.
sameLaneAhead: { D6: D6.4.l, D7: D7.3.i }
# Static objects, kerbs and scooter falls never carry a legal penalty.
staticAndFall: scoreOnly

# Fault by law for ego contacts with vehicles (cars and motorbikes, scripted or traffic). The
# rows run per contact, first match wins (conditions: FaultCondition, src/contracts/rule.js). A
# deduction row resolves the clause through the choice above; a notice row shows the player a
# message and deducts nothing. Pedestrian contacts never enter the table: they keep the accident
# clause and end the run (below contactMinEgoSpeed, a notice instead). Static objects, kerbs and falls enter only the aftermath row.
#
# A deduction needs a player breach (rows 1 and 2) or the player striking a party that had right
# of way (rows 3 and 4, the Luật 36 Điều 12 khoản 3 duty to observe and slow down, charged as
# 10.a). Every other contact is a notice. Contacts below contactMinEgoSpeed never deduct but
# still raise notices, so a stopped player who is rear-ended gets a notice. A pedestrian contact
# below that speed is a notice too, never a deduction or a run end; a static object or kerb below
# it gives nothing.
faultRows:
  - { id: aftermath, when: aftermath, result: notice }
  - { id: from-behind, when: from-behind, result: notice, unlessRearEndContributing: true }
  - { id: contributing, when: contributing-episode, result: deduction }
  - { id: same-lane-ahead, when: same-lane-ahead, result: deduction }
  - { id: ego-strikes, when: ego-strikes, result: deduction }
  - { id: otherwise, when: otherwise, result: notice }
# Every rule's episode contributes to a contact except these. Game design ("ngưỡng của trò
# chơi"): a horn at night cannot cause a contact, although 10.b lists its clause.
nonContributingRules: [night-horn]
# Being hit from behind is the player's fault only after a cut-in or an unsignalled turn put
# them wrongly in front.
rearEndContributingRules: [lane-change, turn-signal]
# Only right-of-way violations of the other party excuse a player who strikes it; a merely
# speeding or tailgating vehicle does not.
excusingViolations: [red-light, wrong-way, no-yield, unsafe-lane-change]
# Game design: an excusing violation excuses the player only if the player's speed at the contact
# (the collision event's egoSpeed) is no more than this (m/s) above its speed when the violation
# first showed on that party. Another
# party's violation does not lift the player's own duty to observe, slow down and keep a safe
# distance (10.a); a player who speeds up into a rider it has seen cut in could have avoided it.
excuseMaxSpeedGainMps: 0.5
# Game design: these excusing violations keep excusing a player who gained speed, unless the other
# vehicle was ahead in the player's lane or was standing at the contact (a wreck, or slower than
# contactMinEgoSpeed in scoring.yaml). A party crossing the player's right of way (running the red,
# or entering without yielding) stays at fault while the player accelerates lawfully, for example
# away from a green light; one standing in the player's path is an obstacle every driver must slow
# down and stop for (Luật 36 Điều 12 khoản 3). The player's own speeding or red-light episode still
# charges the contact through the contributing row first.
rightOfWayViolations: [red-light, no-yield]
# Game design: seconds after a notice contact (rows 1 to 5) during which every further contact
# with a vehicle, a static object or a kerb, and a fall, is a notice too (the shove). Row 0
# notices do not restart the window.
aftermathWindowS: 1.5
# Basis of the fault-table choices above (all game design; the comments give each reason).
paramBasis:
  nonContributingRules: design
  rearEndContributingRules: design
  excusingViolations: design
  aftermathWindowS: design
  excuseMaxSpeedGainMps: design
  rightOfWayViolations: design
# Notice texts, keyed by the other party's first violation, then `from-behind`, then `none`;
# `aftermath` for contacts inside the aftermath window. A contact that is a notice only because
# the player was below contactMinEgoSpeed takes `ego-slow` (a vehicle) or `pedestrian-slow`. `{vehicle}` is replaced by the other
# vehicle's word (xe máy, ô tô, xe buýt…), capitalised at the start of the text. The game never
# states a legal conclusion: only the police decide fault.
noticeTexts:
  red-light: { vi: "{vehicle} vượt đèn đỏ va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  wrong-way: { vi: "{vehicle} đi ngược chiều va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  no-yield: { vi: "{vehicle} không nhường đường va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  unsafe-lane-change: { vi: "{vehicle} chuyển làn ẩu va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  speeding: { vi: "{vehicle} chạy quá tốc độ va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  tailgating: { vi: "{vehicle} không giữ khoảng cách an toàn va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  from-behind: { vi: "Xe khác va vào bạn từ phía sau. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  none: { vi: "{vehicle} va vào bạn. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  aftermath: { vi: "Va chạm tiếp theo sau khi bạn bị xe khác va vào. Trò chơi không ghi nhận lỗi của bạn, không trừ điểm." }
  ego-slow: { vi: "Bạn chạm nhẹ vào {vehicle} ở tốc độ rất thấp. Trò chơi không trừ điểm; hãy giữ khoảng cách an toàn." }
  pedestrian-slow: { vi: "Có va chạm nhẹ với người đi bộ ở tốc độ rất thấp. Trò chơi không trừ điểm; hãy dừng hẳn và nhường đường cho người đi bộ." }
