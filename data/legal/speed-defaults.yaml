# Statutory default speed limits (SpeedDefault records, src/contracts/rule.js) from TT 38/2024
# Điều 6, Bảng 1 (inside a built-up zone) and Bảng 2 (outside). A default applies only where no
# P.127 sign binds the lane. `multiLane` is the first column of each table: a divided road or a
# one-way road with two or more motor lanes.
#
# Every row was read from the official TT 38 text (Government portal PDF, 2024-11-15) on 2026-11-23
# and matches the two commercial copies (luatvietnam, hoatieu.vn). TT 09/2025 does not amend Điều 6.
# `point` names the table and the column; `quote` is the vehicle row's first cell, verbatim. The
# value is the number printed in that row and column.
# No moped rows: xe gắn máy is out of the MVP.

- legalClass: car
  builtUp: true
  multiLane: true
  maxKmh: 60
  citation:
    sourceId: tt38-2024
    article: Điều 6
    clause: "1"
    point: "Bảng 1, cột “Đường đôi; đường một chiều có từ hai làn xe cơ giới trở lên”"
    quote: "Các loại xe cơ giới, trừ các xe được quy định tại Điều 7 và Điều 8 Thông tư này"
    url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2024/11/38-bgtvt.pdf
  verified: true

