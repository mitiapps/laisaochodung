# Personality rows (all design except the normal HDM errors and b_stop).
# Tuned headless on osm-pasteur (20 seeds x 5 min): distractionIntervalS doubled on every row
# (careful 240, normal 120, reckless 40) brought NPC incidents from about 1.3 to inside the
# incidentBand; inattention was the cause of most of them.
# Shares sum to 1. Violation rates are motorbike values; other classes scale some by
# violations.carScale.
personalities:
  careful:
    share: 0.25
    v0Factor: [0.85, 0.95]
    speedingV0Factor: [1.0, 1.0]
    timeGapFactor: 1.3
    minGapFactor: 1.2
    accelFactor: 0.8
    comfortDecelFactor: 0.9
    reactionFactor: 1.0
    distractedReactionFactor: 2.0
    distanceErr: 0.03
    approachErr: 0.007
    mobilPoliteness: 0.5
    mobilThresholdMps2: 0.2
    mobilSafeDecelMps2: 3
    criticalGapFactor: 1.2
    yellowStopDecelMps2: 4.0
    distractionIntervalS: 240
    violations:
      redLight: 0
      earlyStart: 0
      noSignal: 0.1
      distracted: 0.05
      speeding: 0
      wrongWay: 0
      sidewalk: 0
      illegalUturn: 0
      cutIn: 0
      paramBasis:
        { redLight: design, earlyStart: design, noSignal: design, distracted: design, speeding: design,
          wrongWay: design, sidewalk: design, illegalUturn: design, cutIn: design }
    paramBasis:
      share: design
      v0Factor: design
      speedingV0Factor: design
      timeGapFactor: design
      minGapFactor: design
      accelFactor: design
      comfortDecelFactor: design
      reactionFactor: design
      distractedReactionFactor: design
      distanceErr: design
      approachErr: design
      mobilPoliteness: design
      mobilThresholdMps2: design
      mobilSafeDecelMps2: design
      criticalGapFactor: design
      yellowStopDecelMps2: design
      distractionIntervalS: design
