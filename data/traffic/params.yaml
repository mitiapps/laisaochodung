    speedingV0Factor: [1.15, 1.3]
    timeGapFactor: 1.0
    minGapFactor: 1.0
    accelFactor: 1.0
    comfortDecelFactor: 1.0
    reactionFactor: 1.0
    distractedReactionFactor: 3.0
    distanceErr: 0.05
    approachErr: 0.01
    mobilPoliteness: 0.2
    mobilThresholdMps2: 0.1
    mobilSafeDecelMps2: 4
    criticalGapFactor: 1.0
    yellowStopDecelMps2: 3.1
    distractionIntervalS: 120
    violations:
      redLight: 0.04
      earlyStart: 0.05
      noSignal: 0.4
      distracted: 0.2
      speeding: 0.1
      wrongWay: 0.01
      sidewalk: 0.02
      illegalUturn: 0.02
      cutIn: 0.01
      paramBasis:
        { redLight: design, earlyStart: design, noSignal: design, distracted: design, speeding: design,
          wrongWay: design, sidewalk: design, illegalUturn: design, cutIn: design }
    paramBasis:
      share: design
      v0Factor: design
      speedingV0Factor: design
      timeGapFactor: design
      minGapFactor: design
      accelFactor: design
      comfortDecelFactor: design
      reactionFactor: design
      distractedReactionFactor: design
      distanceErr: { sourced: hdm-2006 }
      approachErr: { sourced: hdm-2006 }
      mobilPoliteness: design
      mobilThresholdMps2: design
      mobilSafeDecelMps2: design
      criticalGapFactor: design
      yellowStopDecelMps2: { sourced: nchrp-14396 }
