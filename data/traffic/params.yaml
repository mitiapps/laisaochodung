# Traffic parameters (TrafficParams, src/contracts/traffic.js), compiled by
# `npm run build:traffic` to src/generated/traffic-params.json.
#
# Every number carries a `paramBasis` entry beside it: `design` for a value the game chose, or
# `{sourced: <id>}` naming an entry of `sources` below. The build fails on a number without one.
# Sourced values cite the `sources` table; everything else is a game choice, tuned by watching
# traffic in the game. Record the reason for each tuned value in a comment beside it.

sources:
  tfd-errata:
    description: Treiber and Kesting, Traffic Flow Dynamics, Table 11.2 as corrected in the official errata
    url: https://traffic-flow-dynamics.org/res/ErrataTrafficFlowDynamics.pdf
  hdm-2006:
    description: Treiber, Kesting and Helbing 2006, Delays, inaccuracies and anticipation in microscopic traffic models (HDM)
    url: https://arxiv.org/abs/cond-mat/0404736
  minh-2007:
    description: Minh, Sano and Cao 2007, motorcycle reaction time and dynamic lane width at Vietnamese signalised intersections (J. EASTS 7)
    url: https://www.jstage.jst.go.jp/article/easts/7/0/7_0_2396/_article/-char/en
  minh-2005:
    description: Minh, Sano and Matsumoto 2005, lateral clearance of passing motorcycles in Hanoi (J. EASTS 6)
    url: https://www.jstage.jst.go.jp/article/easts/6/0/6_0_186/_article/-char/en
  easts-p357:
    description: Nguyen and Hanaoka, HCMC Cong Hoa motorcycle study (EASTS Proc. 9, P357)
    url: https://easts.info/on-line/proceedings/vol9/PDF/P357.pdf
  nchrp-14396:
    description: NCHRP, change interval deceleration (NAP 14396, chapter 37)
    url: https://nap.nationalacademies.org/read/14396/chapter/37
  movsim-varcoeff:
    description: Treiber's traffic simulator default driver_varcoeff (reference only, GPL code not copied)
    url: https://github.com/movsim/traffic-simulation-de

