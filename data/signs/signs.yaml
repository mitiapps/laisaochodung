# QCVN 41:2024/BGTVT sign meanings used by the MVP (SignMeaning records, src/contracts/rule.js).
# This is the one list of sign codes: rules data copies it, the renderer draws exactly these
# codes, and the map converter rejects any other code. Adding a code goes through the maintainer.
# Quotes were checked as whitespace-insensitive substrings of the official annex PDF.
# sourceId `qcvn41-2024` must match the Source record in data/legal/.
# figureChecked: date the SVG was compared with the official figure in the annex (Phụ lục B-E, and
# Phụ lục M where it gives a dimensioned drawing), null until then.

