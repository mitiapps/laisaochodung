# Tutorial 3: the tutorial-01 layout at night in rain, under street lights. Headlights, high beam
# and night horn; following distance behind an NPC car; oncoming NPC cars; an NPC car in the
# kerb lane for the lane-change gap. Everything not set here comes from the layout.
kind: tutorial
layout: tutorial-01-co-ban
name: { vi: "Bài 3: Lái đêm trời mưa" }
# 22:30, rain; the wet-road grip is a game value.
environment: { startClockMin: 1350, weather: rain, surfaceGrip: 0.7 }
timeLimitS: 300
lit: true

# The road works stay in the kerb lane here, and the route keeps the inner lane: the NPC car ahead
# drives the inner lane for the following-distance lesson.
obstacles:
  - { id: ob-barrier, kind: barrier, at: { way: rong, s: 100 }, lateral: -5.25, lengthM: 3, widthM: 1.6, heightM: 1 }

route:
  start: { way: hep, s: 12, lane: 0 }
  checkpoints:
    - { way: hep, s: 160 }
    - { way: rong, s: 150, lane: 1 }
    - { way: cuoi, s: 40, lane: 1 }
  finish: { way: cuoi, s: 90 }

actors:
  - id: ped-hep
    kind: pedestrian
    model: pedestrian
    lengthM: 0.5
    widthM: 0.5
    speed: 1.4
    # From the far side and triggered late, so the NPC car ahead has passed the crosswalk
    # before the pedestrian reaches its lane (actors hold only for the player).
    path: { crosswalk: cw-hep, from: left }
    trigger: { way: hep, fromS: 100, toS: 110 }
  # Car ahead in the player's lane, for the following distance.
  - id: npc-ahead
    kind: car
    model: npc-sedan
    lengthM: 4.5
    widthM: 1.8
    speed: 8
    path:
      lanes:
        - { way: hep, index: 0, fromS: 45, toS: 220 }
        - { way: rong, index: 1, fromS: 0, toS: 300 }
        - { way: cuoi, index: 1, fromS: 0, toS: 140 }
    trigger: { atS: 0 }
  # Car in the kerb lane after the road works, for the lane-change gap.
  - id: npc-kerb
    kind: car
    model: npc-sedan
    lengthM: 4.5
    widthM: 1.8
    speed: 9
    path:
      lanes:
        - { way: rong, index: 0, fromS: 115, toS: 300 }
        - { way: cuoi, index: 0, fromS: 0, toS: 140 }
    trigger: { way: rong, fromS: 60, toS: 75 }
  # Oncoming cars, headlights toward the player.
  - id: npc-oncoming-1
    kind: car
    model: npc-sedan
    lengthM: 4.5
    widthM: 1.8
    speed: 9
    path:
      lanes:
        - { way: cuoi, dir: backward, index: 1, fromS: 140, toS: 0 }
        - { way: rong, dir: backward, index: 1, fromS: 300, toS: 0 }
        - { way: hep, dir: backward, index: 0, fromS: 220, toS: 0 }
    trigger: { atS: 0 }
  - id: npc-oncoming-2
    kind: car
    model: npc-sedan
    lengthM: 4.5
    widthM: 1.8
    speed: 9
    path:
      lanes:
        - { way: rong, dir: backward, index: 0, fromS: 300, toS: 0 }
    trigger: { atS: 12 }

# NPC traffic, light density (agents per lane-km, design); maxAgents and the traffic time limit
# are derived by the build. Not inherited from a layout.
traffic:
  densityPerKm: 10
  spawnRingM: [60, 150]
  # Vietnamese mix (design, inside the user's 70–80% motorbikes): taxis, buses and small trucks
  # are cars by law.
  mix:
    - { model: motorbike, share: 0.75 }
    - { model: car, share: 0.12 }
    - { model: taxi, share: 0.06 }
    - { model: bus, share: 0.02 }
    - { model: truck, share: 0.05 }
