# Công xã Paris. Directions come from the extract's node order.
route:
  ways: [329878186, 747231131, 678315474, 803279638]
  start: { at: { way: 329878186, s: 25 }, lane: 1 }
  checkpoints:
    - { way: 747231131, s: 70, lane: 1 }
    - { way: 678315474, s: 40, lane: 1 }
    - { way: 803279638, s: 100, lane: 1 }
  finish: { way: 803279638, s: 75 }
