# OSM corridor map. Map data © OpenStreetMap contributors, ODbL 1.0 (see ../LICENSE-ODbL.md).
# raw.overpass.json is fetched once by hand with `npm run fetch:osm -- osm-pasteur` and committed;
# the build never fetches.
kind: osm
name: { vi: "Pasteur – Lê Duẩn (Quận 1, TP.HCM)" }
bbox: { south: 10.7755, west: 106.6955, north: 10.7812, east: 106.7012 }
# Route ways in driving order (OSM way ids): Pasteur north-west in its one-way direction from Lý
# Tự Trọng, through Nguyễn Du and Hàn Thuyên, then a right turn onto Lê Duẩn towards Công trường
# Công xã Paris. Directions come from the extract's node order.
route:
  ways: [329878186, 747231131, 678315474, 803279638]
  start: { at: { way: 329878186, s: 25 }, lane: 1 }
  checkpoints:
    # Move to the kerb lane mid-block, where the lane lines are dashed, before the right turn
    # (Law 36 Điều 15 khoản 2), and leave the turn in the kerb lane.
    - { way: 747231131, s: 40, lane: 1 }
    - { way: 747231131, s: 110, lane: 0 }
    - { way: 678315474, s: 40, lane: 0 }
    - { way: 803279638, s: 100, lane: 0 }
  finish: { way: 803279638, s: 75 }
# Side-road stubs reach 120 m where the street continues in the extract, so traffic enters out
# of sight of the junctions (the far plane is 300 m). The build logs every stub kept shorter.
stubM: 120
# NPC traffic, full inner-city density (agents per lane-km, design). maxAgents and the traffic
# time limit are derived by the build.
traffic:
  densityPerKm: 30
  spawnRingM: [60, 150]
  # Vietnamese mix (design, inside the user's 70–80% motorbikes): taxis, buses and small trucks
  # are cars by law.
  mix:
    - { model: motorbike, share: 0.75 }
    - { model: car, share: 0.12 }
    - { model: taxi, share: 0.06 }
    - { model: bus, share: 0.02 }
    - { model: truck, share: 0.05 }
