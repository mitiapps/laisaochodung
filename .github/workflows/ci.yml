name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The e2e suite drives two full runs in software WebGL (about 4.5 min on a desktop CPU).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # The CI reporter is 'github', so the traces in test-results/ are what a failure leaves.
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # GitHub Pages serves the site under /<repo>/; Cloudflare Pages builds the root path itself.
  pages-build:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
      - run: npm run release:check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # Publishing rights live only here, away from the jobs that run dependency code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
